name: Build application

on:
    push:
        branches:
            - develop

    pull_request:
        branches:
            - develop


jobs:
    build:
        runs-on: ubuntu-24.04

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Node 18
              uses: actions/setup-node@v4
              with:
                node-version: '18'
                cache: 'npm'

            - name: Set up Docker Buildex
              uses: docker/setup-buildx-action@v4

            - name: Login to Docker Hub
              if: github.event_name == 'push' && github.event.ref == 'refs/heads/develop'
              uses: docker/login-action@v4
              with:
                username: ${{ vars.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build Docker image
              uses: docker/build-push-action@v7
              with:
                context: .
                file: .Dockerfile
                push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
                tags: |
                  ${{ vars.DOCKERHUB_USERNAME }}/node-ci:develop
                  ${{ vars.DOCKERHUB_TOKEN }}/node-ci:${{ github.sha}}
