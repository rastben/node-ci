name: Build application

on:
    push:
        branches:
            - develop

    pull_request:
        branches:
            - develop


jobs:
    build:
        runs-on: ubuntu-24.04

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Node 18
              uses: actions/setup-node@v4
              with:
                node-version: '18'
                cache: 'npm'



